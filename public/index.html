<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181818"><title>Listening room · SoundCloud Jam</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="nav"><a href="/" class="brand" aria-label="SoundCloud home"><svg viewBox="0 0 56 30" aria-hidden="true"><path d="M1 16v5m4-9v12m4-15v17m4-20v21m4-24v24m4-25v25" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M24 27V3c8-6 19 0 20 9 13-3 17 15 4 15Z" fill="currentColor"/></svg><b>SoundCloud</b></a><span class="navcurrent">Listening room</span><span class="profile"><i data-icon="user"></i> Guest</span></div></header>
<main><div class="heading"><div class="eyebrow"><span></span> SOUNDCLOUD JAM</div><h1>Listening room<span>.</span></h1></div>
<section class="hero" aria-label="Track player"><img id="cover" src="/art/0.jpg" alt="Afterglow cover"><div class="heroBody"><div class="meta"><span class="now"><i data-icon="levels"></i> ON THE DECK</span><span id="genre">Melodic techno</span></div><div class="titleRow"><button class="bigplay play" aria-label="Play track"><i data-icon="play"></i></button><div><h2 id="title">Afterglow</h2><span id="artist">Signal Archive</span></div></div><div class="wavearea"><canvas id="wave" tabindex="0" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="61" aria-valuenow="0"></canvas><div id="markers"></div></div><div class="times"><span id="time">0:00</span><span id="length">1:01</span></div></div></section>
<div class="actions"><button class="primary" id="jam"><i data-icon="group"></i><span>Start Jam</span></button><button id="share"><i data-icon="share"></i>Share</button><span id="status" role="status">Solo listening</span></div>
<div class="columns"><section class="queue"><div class="sectionTitle"><div><span class="eyebrow">PLAYBACK</span><h3>Up next <small id="count">3</small></h3></div><button id="add"><i data-icon="plus"></i>Add track</button></div><div id="rows"></div></section>
<aside><div class="sectionTitle"><div><span class="eyebrow">ON THE WAVEFORM</span><h3>Reactions</h3></div><i data-icon="chat"></i></div><div id="reactionBox"><div id="reactionText">Start a Jam to react together.</div><div id="emojis"></div></div><div id="feed"></div></aside></div><div id="widgetBox"></div></main>
<footer><div class="dock"><img id="miniCover" src="/art/0.jpg" alt=""><div class="mini"><b id="miniTitle">Afterglow</b><span id="miniArtist">Signal Archive</span></div><div class="controls"><button class="play" aria-label="Play track"><i data-icon="play"></i></button><button id="next" aria-label="Skip to next track"><i data-icon="next"></i></button></div><span id="dockTime">0:00</span><input id="progress" aria-label="Seek" type="range" min="0" max="1000" value="0"><span id="dockLength">1:01</span><button id="mute" aria-label="Mute"><i data-icon="volume"></i></button></div></footer>
<dialog id="dialog"><form method="dialog" class="dialogtop"><h3 id="dialogTitle"></h3><button aria-label="Close">×</button></form><div id="dialogContent"></div></dialog><div id="toast" role="status"></div><audio id="audio" preload="auto"></audio><script src="/app.js"></script></body></html>
